# ==========================================
# 로컬 개발 환경 설정 (application-local.properties)
# 사용법: --spring.profiles.active=local
# ==========================================

# MySQL Database Configuration for Local Development
# 포트 3307: docker-compose의 mysql 컨테이너가 호스트에 노출하는 포트 ("3307:3306")
# 사용법: docker-compose up -d mysql redis 후 bootRun
spring.datasource.url=jdbc:mysql://localhost:3307/tongnamuking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Redis Configuration - 로컬 개발용 (docker-compose의 redis 컨테이너)
spring.data.redis.url=redis://localhost:6379

# CORS 설정 - 로컬 개발용
cors.allowed.origins=http://localhost:5173,http://localhost:3000

# JPA Configuration - 개발환경
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session Configuration - 로컬 개발용 (보안 완화)
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=false

# 로깅 레벨 설정
logging.level.com.tongnamuking=DEBUG
logging.level.org.springframework.web=DEBUG

# 멀티채널 수집기 데몬 - 로컬 개발용
# bootRun의 작업 디렉터리가 tongnamuking-backend/ 이므로 상위로 올라간다
collector.daemon.script=../chat-collector/daemon.js

# 독케익 전용 수집기 - 로컬 개발용 (같은 이유로 상위로 올라간다)
dogcake.collector.script=../chat-collector/index.js