spring.application.name=tongnamuking-backend

# MySQL Database Configuration - Using Railway MYSQL_URL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/tongnamuking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Redis Configuration (실시간 순위 저장소)
# 운영: SPRING_DATA_REDIS_URL 환경변수 (Upstash rediss:// URL → TLS 자동 적용)
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

# CORS 설정
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://tong-na-mu-king.vercel.app}

# JPA Configuration  
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# 멀티채널 수집기 데몬 (chat-collector/daemon.js)
# 운영(Docker): Dockerfile이 chat-collector를 /app/chat-collector로 복사한다
collector.daemon.enabled=${COLLECTOR_DAEMON_ENABLED:true}
collector.daemon.script=${COLLECTOR_SCRIPT:/app/chat-collector/daemon.js}
collector.daemon.port=${COLLECTOR_PORT:3001}
